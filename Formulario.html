<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pedido - Huaraches</title>

<style>

body{
    font-family: Arial;
    background-color: #f4ede6;
    text-align: center;
    margin: 0;
}

/* CONTENEDOR */
.container{
    margin: 40px auto;
    width: 500px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* TITULOS */
h2{
    color: #5C2D0A;
    margin-bottom: 10px;
}

h3{
    color: #A0480F;
    margin-top: 25px;
}

/* LABELS */
label{
    display: block;
    margin: 8px 0;
    font-size: 18px;
}

/* MENSAJE */
.submensaje{
    font-size: 14px;
    margin-bottom: 20px;
    color: #555;
}

/* SELECT */
select{
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-top: 10px;
    margin-bottom: 20px;
    font-size: 16px;
}

/* BOTONES */
button{
    margin-top: 20px;
    padding: 12px 20px;
    background: #E07B39;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover{
    background: #A0480F;
}

/* RESULTADO */
#ticket{
    text-align: left;
    margin-top: 25px;
    background: #fff8f2;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #f0d7c6;
}

</style>
</head>

<body>

<div class="container">

<h2>Arma tu huarache 🌮</h2>

<p class="submensaje">
El costo se basa en el ingrediente de mayor precio; cada adicional incrementa $25.
</p>

<!-- INGREDIENTES -->
<h3>Ingredientes</h3>

<label><input type="checkbox" value="45" data-nombre="Bistec"> Bistec ($45)</label>
<label><input type="checkbox" value="45" data-nombre="Salchicha"> Salchicha ($45)</label>
<label><input type="checkbox" value="45" data-nombre="Queso"> Queso ($45)</label>
<label><input type="checkbox" value="45" data-nombre="Huevo"> Huevo ($45)</label>
<label><input type="checkbox" value="45" data-nombre="Longaniza"> Longaniza ($45)</label>

<label><input type="checkbox" value="80" data-nombre="Cecina natural"> Cecina natural ($80)</label>
<label><input type="checkbox" value="80" data-nombre="Cecina adobada"> Cecina adobada ($80)</label>
<label><input type="checkbox" value="80" data-nombre="Arrachera"> Arrachera ($80)</label>
<label><input type="checkbox" value="80" data-nombre="Costilla"> Costilla ($80)</label>

<!-- SALSA -->
<h3>Elige tu salsa</h3>

<select id="salsa">
    <option value="">Selecciona una salsa</option>
    <option value="Verde">Salsa verde</option>
    <option value="Roja">Salsa roja</option>
    <option value="Mixta">De las dos</option>
    <option value="Sin salsa">Sin salsa</option>
</select>

<!-- QUESO -->
<h3>¿Queso rayado?</h3>

<select id="queso">
    <option value="">Selecciona una opción</option>
    <option value="Sí">Sí</option>
    <option value="No">No</option>
</select>

<!-- BEBIDAS -->
<h3>Bebida</h3>

<select id="bebida">
    <option value="">Selecciona una bebida</option>
    <option value="Agua de guayaba">Agua de guayaba (1L - $30)</option>
    <option value="Agua de Jamaica">Agua de Jamaica (1L - $30)</option>
    <option value="Sin bebida">Sin bebida</option>
</select>

<!-- BOTON -->
<button onclick="finalizarPedido()">Finalizar pedido</button>

<!-- RESULTADO -->
<div id="ticket"></div>

</div>

<script>

function finalizarPedido(){

    let checks = document.querySelectorAll('input[type="checkbox"]:checked');

    if(checks.length === 0){
        alert("Selecciona al menos un ingrediente");
        return;
    }

    if(checks.length > 9){
        alert("Máximo 9 ingredientes");
        return;
    }

    let ingredientes = [];
    let precios = [];

    checks.forEach(el => {
        ingredientes.push(el.dataset.nombre);
        precios.push(parseInt(el.value));
    });

    let salsa = document.getElementById("salsa").value;
    let queso = document.getElementById("queso").value;
    let bebida = document.getElementById("bebida").value;

    if(salsa === "" || queso === "" || bebida === ""){
        alert("Completa todos los apartados");
        return;
    }

    /* CALCULO TOTAL */
    let base = Math.max(...precios);
    let extras = precios.length - 1;
    let total = base + (extras * 25);

    if(
        bebida === "Agua de guayaba" ||
        bebida === "Agua de Jamaica"
    ){
        total += 30;
    }

    let bebidaTexto =
        bebida === "Sin bebida"
        ? "No incluye"
        : bebida + " (1L)";

    /* MOSTRAR TICKET */
    let ticket =
    "<h2>🧾 Tu pedido</h2>" +

    "<strong>Ingredientes:</strong><br>" +
    ingredientes.join(", ") +

    "<br><br><strong>Salsa:</strong> " + salsa +

    "<br><strong>Queso rayado:</strong> " + queso +

    "<br><strong>Bebida:</strong> " + bebidaTexto +

    "<br><br><strong>Total:</strong> $" + total;

    document.getElementById("ticket").innerHTML = ticket;
}

</script>

</body>
</html>
